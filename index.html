<!doctype html>
<html lang="fa" dir="rtl" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>آریا قاسمی · کارگاه طراحی</title>
    <meta
      name="description"
      content="سیستم طراحی و کتابخانهٔ قطعات سایت شخصی آریا قاسمی — چندزبانه، ساخته‌شده برای وردپرس و المنتور."
    />
    <meta name="color-scheme" content="dark light" />
    <link rel="stylesheet" href="assets/css/tokens.css" />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/dashboard.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2305070f'/%3E%3Cg fill='none' stroke='%23c9a961' stroke-width='1.3'%3E%3Crect x='8' y='8' width='16' height='16' rx='2'/%3E%3Crect x='8' y='8' width='16' height='16' rx='2' transform='rotate(45 16 16)'/%3E%3C/g%3E%3Ccircle cx='16' cy='16' r='3' fill='%2335d6c0'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <a class="skip" href="#view">رفتن به محتوا</a>

    <div class="shell">
      <!-- ── rail ─────────────────────────────────────────────────────────── -->
      <aside class="rail" id="rail">
        <div class="rail__brand">
          <span class="mark" aria-hidden="true">
            <svg viewBox="0 0 32 32">
              <rect x="8" y="8" width="16" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.3" />
              <rect
                x="8"
                y="8"
                width="16"
                height="16"
                rx="2"
                fill="none"
                stroke="currentColor"
                stroke-width="1.3"
                transform="rotate(45 16 16)"
              />
              <circle cx="16" cy="16" r="3.1" fill="var(--accent)" />
            </svg>
          </span>
          <span class="rail__id">
            <strong class="rail__name" data-i18n="brand.name">آریا قاسمی</strong>
            <span class="rail__role" data-i18n="brand.atelier">کارگاه طراحی</span>
          </span>
        </div>

        <nav class="rail__nav" id="railNav" aria-label="بخش‌ها"></nav>

        <div class="rail__foot">
          <div class="seg" role="group" aria-label="زبان" id="localeSeg"></div>
          <div class="seg" role="group" aria-label="پوسته" id="themeSeg"></div>
          <a
            class="rail__repo"
            href="https://github.com/ariaghasemi/ariagh.ir"
            target="_blank"
            rel="noreferrer noopener"
          >
            <span data-i18n="top.repo">مخزن</span>
            <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true">
              <path
                fill="currentColor"
                d="M8 .5a7.5 7.5 0 0 0-2.37 14.62c.37.07.5-.16.5-.36v-1.3c-2.05.45-2.48-.99-2.48-.99-.34-.86-.83-1.09-.83-1.09-.67-.46.05-.45.05-.45.75.06 1.14.77 1.14.77.66 1.13 1.73.8 2.15.62.07-.48.26-.8.47-.99-1.65-.19-3.38-.83-3.38-3.68 0-.81.29-1.48.76-2-.08-.19-.33-.94.07-1.96 0 0 .62-.2 2.02.76a6.9 6.9 0 0 1 3.68 0c1.4-.96 2.02-.76 2.02-.76.4 1.02.15 1.77.07 1.96.47.52.76 1.19.76 2 0 2.86-1.73 3.49-3.39 3.67.27.23.5.68.5 1.38v2.04c0 .2.13.43.51.36A7.5 7.5 0 0 0 8 .5Z"
              />
            </svg>
          </a>
        </div>
      </aside>

      <!-- ── main ─────────────────────────────────────────────────────────── -->
      <div class="main">
        <header class="topbar">
          <button class="iconbtn rail-toggle" id="railToggle" aria-label="فهرست" aria-expanded="false">
            <svg viewBox="0 0 20 20" width="17" height="17" aria-hidden="true">
              <path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none" />
            </svg>
          </button>
          <div class="topbar__crumb">
            <span class="topbar__crumb-label" id="crumb"></span>
          </div>
          <div class="topbar__actions">
            <span class="badge" id="buildBadge">v0.1.0</span>
          </div>
        </header>

        <main class="view" id="view" tabindex="-1"></main>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script type="module" src="assets/js/app.js"></script>
  </body>
</html>
