<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04060a"/>
      <stop offset="0.45" stop-color="#0b1018"/>
      <stop offset="1" stop-color="#04060a"/>
    </linearGradient>
    <radialGradient id="vign" cx="0.5" cy="0.45" r="0.85">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.6"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>
    <filter id="soft2" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="9" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="lblblur" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <filter id="typeblur" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="0.4"/>
    </filter>
  </defs>

  <!-- آسمان ابری تیره -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <g filter="url(#soft2)" opacity="0.75">
    <ellipse cx="1180" cy="260" rx="430" ry="210" fill="#2c3542"/>
    <ellipse cx="980" cy="420" rx="380" ry="170" fill="#1c232e"/>
    <ellipse cx="430" cy="620" rx="460" ry="230" fill="#141a23"/>
    <ellipse cx="1420" cy="700" rx="360" ry="200" fill="#171e28"/>
  </g>
  <g filter="url(#soft)" opacity="0.55">
    <ellipse cx="1240" cy="210" rx="300" ry="120" fill="#46536a"/>
    <ellipse cx="760" cy="300" rx="260" ry="110" fill="#2a3342"/>
    <ellipse cx="220" cy="240" rx="240" ry="120" fill="#232b37"/>
    <ellipse cx="860" cy="760" rx="420" ry="150" fill="#202733"/>
  </g>
  <rect width="1600" height="900" fill="url(#vign)"/>
  <rect width="1600" height="900" filter="url(#grain)" opacity="0.05"/>

  <!-- نوار بالا -->
  <g fill="#ffffff">
    <text x="40" y="57" font-size="26" font-weight="500" letter-spacing="-0.6">Mainframe®</text>
    <text x="203" y="58" font-size="30" letter-spacing="-0.6">✳︎</text>
    <text x="800" y="56" font-size="23" text-anchor="middle">Labs, Studio, Openings, Shop</text>
    <text x="1560" y="56" font-size="23" text-anchor="end" text-decoration="underline" text-underline-offset="4">Get in touch</text>
  </g>

  <!-- بلوک محتوای هیرو -->
  <!-- ۱ — لیبل تار -->
  <g filter="url(#lblblur)" fill="#ffffff" font-size="26" font-weight="400">
    <text x="40" y="343">Hey there, meet A.R.I.A,</text>
    <text x="40" y="377">Mainframe&#39;s Adaptive Response Interface Agent</text>
  </g>

  <!-- ۲ — متن تایپ‌نویسر + بصر -->
  <g filter="url(#typeblur)" fill="#ffffff" font-size="26" font-weight="400">
    <text x="40" y="435">Glad you stopped in. Good taste tends to</text>
    <text x="40" y="470">find us. Now, what are we building?</text>
  </g>
  <rect x="497" y="449" width="2.5" height="29" fill="#ffffff">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- ۳ — دکمه‌های قرصی (ردیف اول) -->
  <g font-size="15" font-weight="400">
    <g>
      <rect x="43" y="508" width="150" height="30" rx="15" fill="#ffffff" stroke="rgba(0,0,0,0.1)"/>
      <text x="118" y="528" text-anchor="middle" fill="#000000">Pitch us an idea</text>
    </g>
    <g>
      <rect x="199" y="508" width="146" height="30" rx="15" fill="#ffffff" stroke="rgba(0,0,0,0.1)"/>
      <text x="272" y="528" text-anchor="middle" fill="#000000">Come work here</text>
    </g>
    <g>
      <rect x="351" y="508" width="164" height="30" rx="15" fill="#ffffff" stroke="rgba(0,0,0,0.1)"/>
      <text x="433" y="528" text-anchor="middle" fill="#000000">Send a brief hello</text>
    </g>

    <!-- ردیف دوم -->
    <g>
      <rect x="43" y="548" width="170" height="30" rx="15" fill="#ffffff" stroke="rgba(0,0,0,0.1)"/>
      <text x="128" y="568" text-anchor="middle" fill="#000000">See how we operate</text>
    </g>
    <!-- قرص خط‌دار + آیکون کپی -->
    <g>
      <rect x="219" y="548" width="256" height="30" rx="15" fill="none" stroke="#ffffff"/>
      <text x="239" y="568" fill="#ffffff">Reach us: <tspan text-decoration="underline" text-underline-offset="1">hello@mainframe.co</tspan></text>
      <g transform="translate(441,557)" stroke="#ffffff" stroke-width="1" fill="none">
        <rect x="4.25" y="4.25" width="6.5" height="6.5" rx="1.2"/>
        <rect x="1.25" y="1.25" width="6.5" height="6.5" rx="1.2"/>
      </g>
    </g>
  </g>
</svg>
