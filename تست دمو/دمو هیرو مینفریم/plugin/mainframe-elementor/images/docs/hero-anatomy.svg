<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" font-family="Tahoma, 'Segoe UI', Arial, sans-serif">
  <defs>
    <radialGradient id="glow" cx="0.7" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#2a3140"/>
      <stop offset="0.55" stop-color="#151a22"/>
      <stop offset="1" stop-color="#0b0d12"/>
    </radialGradient>
    <filter id="lblb" x="-10%" y="-40%" width="120%" height="180%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
    <marker id="arwD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <style>
    .num { fill: #f5f6f8; }
    .numT { fill: #0c0d10; font-size: 15px; font-weight: bold; text-anchor: middle; }
    .call { stroke: #6b7280; stroke-width: 1.5; fill: none; stroke-dasharray: 4 4; }
    .lt { fill: #e8eaee; font-size: 16px; font-weight: bold; }
    .ls { fill: #8b93a1; font-size: 12.5px; font-family: ui-monospace, Menlo, Consolas, monospace; }
  </style>

  <rect width="1200" height="700" rx="16" fill="#0c0d10"/>

  <!-- ماکت هیرو -->
  <rect x="40" y="40" width="820" height="560" rx="14" fill="url(#glow)" stroke="#2c303a" stroke-width="1.5"/>

  <!-- نوار بالای ماکت -->
  <text x="72" y="86" font-size="19" font-weight="bold" fill="#ffffff" letter-spacing="-0.4">Mainframe®</text>
  <text x="200" y="87" font-size="22" fill="#ffffff">✳︎</text>
  <text x="450" y="85" font-size="14" fill="#ffffff" text-anchor="middle">Labs, Studio, Openings, Shop</text>
  <text x="828" y="85" font-size="14" fill="#ffffff" text-anchor="end" text-decoration="underline">Get in touch</text>

  <!-- برچسب تار -->
  <g filter="url(#lblb)" fill="#ffffff">
    <text x="80" y="210" font-size="17">Hey there, meet A.R.I.A,</text>
    <text x="80" y="236" font-size="17">Mainframe&#39;s Adaptive Response Interface Agent</text>
  </g>

  <!-- تایپ‌نویسر -->
  <text x="80" y="300" font-size="17" fill="#ffffff">Glad you stopped in. Good taste tends to find us.</text>
  <text x="80" y="328" font-size="17" fill="#ffffff">Now, what are we building?</text>
  <rect x="360" y="310" width="2.5" height="24" fill="#ffffff">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- قرص‌ها -->
  <g font-size="12">
    <rect x="80" y="372" width="128" height="28" rx="14" fill="#ffffff" stroke="rgba(0,0,0,0.1)"/>
    <text x="144" y="390" text-anchor="middle" fill="#000">Pitch us an idea</text>
    <rect x="216" y="372" width="122" height="28" rx="14" fill="#ffffff" stroke="rgba(0,0,0,0.1)"/>
    <text x="277" y="390" text-anchor="middle" fill="#000">Come work here</text>
    <rect x="346" y="372" width="134" height="28" rx="14" fill="#ffffff" stroke="rgba(0,0,0,0.1)"/>
    <text x="413" y="390" text-anchor="middle" fill="#000">Send a brief hello</text>

    <rect x="80" y="410" width="140" height="28" rx="14" fill="#ffffff" stroke="rgba(0,0,0,0.1)"/>
    <text x="150" y="428" text-anchor="middle" fill="#000">See how we operate</text>
    <rect x="228" y="410" width="214" height="28" rx="14" fill="none" stroke="#ffffff"/>
    <text x="244" y="428" fill="#ffffff">Reach us: <tspan text-decoration="underline">hello@mainframe.co</tspan></text>
    <g transform="translate(418,418)" stroke="#ffffff" stroke-width="1" fill="none">
      <rect x="4.25" y="4.25" width="6.5" height="6.5" rx="1.2"/>
      <rect x="1.25" y="1.25" width="6.5" height="6.5" rx="1.2"/>
    </g>
  </g>

  <!-- زیرنویس ماکت -->
  <text x="80" y="576" font-size="12.5" fill="#6b7280" font-family="ui-monospace, Menlo, Consolas, monospace">height: 100vh · content: max-width 576px · video: object-position 70% center</text>

  <!-- شماره‌های روی ماکت -->
  <circle class="num" cx="770" cy="300" r="17"/>
  <text class="numT" x="770" y="306">1</text>

  <circle class="num" cx="66" cy="62" r="17"/>
  <text class="numT" x="66" y="68">2</text>

  <circle class="num" cx="60" cy="196" r="17"/>
  <text class="numT" x="60" y="202">3</text>

  <circle class="num" cx="60" cy="290" r="17"/>
  <text class="numT" x="60" y="296">4</text>

  <circle class="num" cx="60" cy="386" r="17"/>
  <text class="numT" x="60" y="392">5</text>

  <!-- ستون راهنما -->
  <text x="1160" y="76" text-anchor="end" font-size="20" font-weight="bold" fill="#e8eaee" direction="rtl">نقشهٔ هیرو — کدام شماره، کدام ویجت</text>
  <line x1="900" y1="94" x2="1160" y2="94" stroke="#2c303a" stroke-width="1.5"/>

  <circle class="num" cx="1144" cy="140" r="16"/>
  <text class="numT" x="1144" y="146">1</text>
  <text class="lt" x="1116" y="136" text-anchor="end" direction="rtl">ویدیوی حرکت با ماوس</text>
  <text class="ls" x="1116" y="158" text-anchor="end">mainframe-scrub-video</text>

  <circle class="num" cx="1144" cy="230" r="16"/>
  <text class="numT" x="1144" y="236">2</text>
  <text class="lt" x="1116" y="226" text-anchor="end" direction="rtl">نوار بالا (لوگو، لینک‌ها، همبرگر)</text>
  <text class="ls" x="1116" y="248" text-anchor="end">mainframe-navbar</text>

  <circle class="num" cx="1144" cy="320" r="16"/>
  <text class="numT" x="1144" y="326">3</text>
  <text class="lt" x="1116" y="316" text-anchor="end" direction="rtl">برچسب مقدمه (تار)</text>
  <text class="ls" x="1116" y="338" text-anchor="end">mainframe-intro-label</text>

  <circle class="num" cx="1144" cy="410" r="16"/>
  <text class="numT" x="1144" y="416">4</text>
  <text class="lt" x="1116" y="406" text-anchor="end" direction="rtl">تایپ‌نویسر با بصر چشمک‌زن</text>
  <text class="ls" x="1116" y="428" text-anchor="end">mainframe-typewriter</text>

  <circle class="num" cx="1144" cy="500" r="16"/>
  <text class="numT" x="1144" y="506">5</text>
  <text class="lt" x="1116" y="496" text-anchor="end" direction="rtl">دکمه‌های قرصی + کپی ایمیل</text>
  <text class="ls" x="1116" y="518" text-anchor="end">mainframe-pills</text>

  <text x="1160" y="590" text-anchor="end" font-size="13" fill="#6b7280" direction="rtl">هر پنج بخش قابل ویرایش در پنل تنظیمات ویجت‌اند.</text>
  <text x="1160" y="614" text-anchor="end" font-size="13" fill="#6b7280" direction="rtl">در قالب آماده از قبل چیده شده‌اند؛ در صفحهٔ دیگر هم قابل استفاده‌اند.</text>
</svg>
